modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/Layers-of-Railways/Railway/issues"
license = "MIT"

[[mods]]
modId = "railways"
version = "${version}"
displayName = "Create: Steam 'n' Rails"
authors = "The Railways Team"
description = '''Customization and extension of Create rail systems and steam system
    Features include:
        Custom track types for all vanilla woods
        Conductors that can operate redstone and carry toolboxes
        and more to come...'''
logoFile = "icon.png"

[[mixins]]
config = "railways-common.mixins.json"

[[mixins]]
config = "railways.mixins.json"

[[dependencies.railways]]
modId = "neoforge"
mandatory = true
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.railways]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.railways]]
modId="create"
mandatory=true
versionRange="[6.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.railways]]
modId="hexcasting"
type="optional"
versionRange="[0,)"
ordering="AFTER" # Steam 'n' Rails should load after hexcasting
side="BOTH"

[[dependencies.railways]]
modId="voicechat"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"